# Settings shared by all planning horizons. Use together with a horizon file:
#   snakemake --configfile config/config.common.yaml config/config.2025.yaml

run:
  name: all    # runs every scenario in config/scenarios.yaml
  scenarios:
    enable: true
    file: config/scenarios_some.yaml
    # file: config/scenarios_all.yaml
  disable_progressbar: true
  shared_resources:
    policy: base  # share network/renewable resources; composed networks stay per scenario

snapshots:
  start: "2025-01-01 00:00"
  end: "2025-12-31 23:00"

atlite:
  default_cutout: "europe-2025-sarah3-era5"
  cutouts:
    "europe-1940-2025-era5":
      time:
      - '2025'
      - '2025'

clustering:
  mode: administrative
  administrative:
    level: bz                 # based on bidding zone's
  temporal:
    averaging: false          # 3h for testing
  simplify_network:
    consider_efficiency_classes: [0.16, 0.5, 0.84] # bool | list[float] = False,

solving:
  options:
    io_api: direct
    custom_extra_functionality: ../scripts/custom_extra_functionality.py
    # dispatch only: capacities are given, nothing is optimised
    fixed_capacities:
      enable: true
      pemmdb:
        enable: true
        path:                 # unset: retrieve data.pemmdb; or custom dir with PEMMDB_<node>_NationalTrends_<year>.xlsx
        year_map: {}          # e.g. {2025: 2030}; no PEMMDB data for 2025
      file:   # optional overrides (component,name,capacity), applied after PEMMDB
    load_shedding:
      enable: true            # ensures feasibility with given capacities
      default_cost: 10000     # EUR/MWh (bus carrier unit)
      all_carriers: true
    load_sinks:
      enable: true            # absorbs surplus (e.g. process emissions, biomass) when outlets have no capacity
      default_cost: 10000
      all_carriers: true
  solver:
    name: "gurobi"             # default solver is gurobi, could be "highs"
    options: "gurobi-default"  # ... and "highs-default"

# power plant grouping: one link per node and fuel, matching the PEMMDB thermal categories
sector:
  enabled: false
  transport: false
  heating: false
  biomass: false
  industry: false
  shipping: false
  aviation: false
  agriculture: false
  fossil_fuels: true
  district_heating:
    ptes:
      enable: false
  conventional_generation:
    OCGT: gas
    CCGT: gas
    coal: coal
    lignite: lignite
    oil: oil
  # one link per PEMMDB plant class: <node> <generator> <class>, net efficiency (LHV)
  # standard values of the ENTSO-E (TYNDP/ERAA) common data; verify against your dataset
  conventional_generation_classes:
    coal: {old 1: 0.35, old 2: 0.40, new: 0.46, CCS: 0.38}
    lignite: {old 1: 0.35, old 2: 0.40, new: 0.46, CCS: 0.38}
    CCGT:
      conventional old 1: 0.36
      conventional old 2: 0.41
      old 1: 0.40
      old 2: 0.48
      present 1: 0.56
      present 2: 0.58
      new: 0.60
      CCS: 0.51
    OCGT: {old: 0.35, new: 0.42}
    oil: {light: 0.35, heavy old 1: 0.35, heavy old 2: 0.40, shale old: 0.29, shale new: 0.39}
  conventional_generation_ccs_capture_rate: 0.9

# hourly matching of the additional 100 MW load; enabled per scenario via target > 0 (config/scenarios.yaml)
industry:
  hourly_matching:
    mode: hourly            # matching granularity: hourly | daily | weekly | monthly | annual
    target_scope: period    # period: target met in every period; annual: target = annual share matched at that granularity
    carriers: [onwind, solar]
    storage: [battery]
    fix_base: true          # fix all capacities to the solved base scenario; only the CI bus may build VRE and battery
    base_scenario: base
    curtailed_import: true  # otherwise curtailed grid VRE (same country/hour) may be imported and counts as matched
    max_excess_share: 0.2   # e.g. 0.2 to cap excess sales to the grid at 20% of consumption

plotting:
  tech_colors:
    CI grid import: "#8a8a8a"
    CI grid export: "#c7c7c7"
    CI curtailment import: "#b5d99c"

renewable:
  onwind:
    resource_classes: 1
  solar:
    resource_classes: 1
  "offwind-ac":
    resource_classes: 1
  "offwind-dc":
    resource_classes: 1
  "offwind-float":
    resource_classes: 1

electricity:
  voltages:
  - 220.0
  - 300.0
  - 330.0
  - 380.0
  - 400.0
  - 500.0
  - 750.0
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []

energy:
  energy_totals_year: 2025
  base_emissions_year: 1990
