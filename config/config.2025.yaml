# Horizon-specific settings; load after config/config.common.yaml:
#   snakemake --configfile config/config.common.yaml config/config.2025.yaml

planning_horizons: 2025

solving:
  options:
    fixed_capacities:
      enable: false
      pemmdb:
        year_map: {2025: 2030}
  solver_options:
    "gurobi-default":
      threads: 4 # 32
